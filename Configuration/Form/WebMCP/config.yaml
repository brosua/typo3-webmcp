name: brosua/webmcp-form
label: 'WebMCP — Form tool attributes'
priority: 100

prototypes:
  standard:
    formEditor:
      translationFiles:
        20: 'EXT:typo3_webmcp/Resources/Private/Language/FormEditor.xlf'
    formElementsDefinition:
      Form:
        renderingOptions:
          # Below the form.templates.templateRootPath site setting (20), so a site's own template wins.
          templateRootPaths:
            15: 'EXT:typo3_webmcp/Resources/Private/Form/Frontend/Templates/'
        formEditor:
          editors:
            350:
              identifier: webmcpToolName
              templateName: Inspector-TextEditor
              label: formEditor.elements.Form.editor.webmcpToolName.label
              description: formEditor.elements.Form.editor.webmcpToolName.description
              propertyPath: renderingOptions.webmcp.toolname
              doNotSetIfPropertyValueIsEmpty: true
            360:
              identifier: webmcpToolDescription
              templateName: Inspector-TextEditor
              label: formEditor.elements.Form.editor.webmcpToolDescription.label
              description: formEditor.elements.Form.editor.webmcpToolDescription.description
              propertyPath: renderingOptions.webmcp.tooldescription
              doNotSetIfPropertyValueIsEmpty: true

      Text:
        formEditor:
          editors:
            232: &webmcpToolParamDescription
              identifier: webmcpToolParamDescription
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.webmcpToolParamDescription.label
              description: formEditor.elements.FormElement.editor.webmcpToolParamDescription.description
              propertyPath: properties.fluidAdditionalAttributes.toolparamdescription
              doNotSetIfPropertyValueIsEmpty: true
      Textarea:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      Email:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      Telephone:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      Url:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      Number:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      Date:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      DatePicker:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      Password:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      AdvancedPassword:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      FileUpload:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      ImageUpload:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      Checkbox:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      MultiCheckbox:
        formEditor:
          editors:
            232: *webmcpToolParamDescription
      RadioButton:
        formEditor:
