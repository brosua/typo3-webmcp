name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check syntax
        run: |
          find Resources/Public/JavaScript -name '*.js' -print0 | while IFS= read -r -d '' file; do
            cp "$file" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "::error file=$file::Syntax error"; exit 1; }
          done
